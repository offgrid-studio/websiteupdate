<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkered Background</title>
    <link rel="stylesheet" href="stylebox.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    <style>
        
    </style>
</head>
<body>
    <div class="content">
        <div class="glass-circle" id="morphing-shape">
            <div class="text-content" id="text-content"></div>
        </div>
        <!-- Hidden canvas for magnifying glass effect -->
        <canvas id="lens-canvas" width="200" height="200"></canvas>
        
        <!-- Test squares for dynamic content -->
        <div class="test-squares">
            <div class="test-square red-square" id="red-square"></div>
            <div class="test-square blue-square" id="blue-square"></div>
            <div class="test-square green-square" id="green-square"></div>
        </div>
    </div>
    <script src="jsbox.js"></script>
</body>
</html>
